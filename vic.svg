<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Vic, assistente virtual da PV Vendas">
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#d9ffc2"/>
      <stop offset="1" stop-color="#86ff3c"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2421"/>
      <stop offset="1" stop-color="#0d0b0a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe3d6"/>
      <stop offset="1" stop-color="#f1cdb9"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- cabelo de trás -->
    <path d="M46 92c0-38 24-62 54-62s54 24 54 62v70c0 14-10 26-24 30H70c-14-4-24-16-24-30z" fill="url(#hair)"/>
    <!-- corpo / blusa -->
    <path d="M38 200c4-30 28-48 62-48s58 18 62 48z" fill="#111"/>
    <path d="M86 152h28l-14 22z" fill="url(#skin)"/>
    <!-- pescoço -->
    <path d="M88 126h24v30c-4 6-20 6-24 0z" fill="#ecc3ad"/>
    <!-- rosto -->
    <ellipse cx="100" cy="98" rx="34" ry="40" fill="url(#skin)"/>
    <!-- orelhas -->
    <ellipse cx="66" cy="102" rx="5" ry="8" fill="#f1cdb9"/>
    <ellipse cx="134" cy="102" rx="5" ry="8" fill="#f1cdb9"/>
    <circle cx="66" cy="112" r="2.2" fill="#86ff3c"/>
    <circle cx="134" cy="112" r="2.2" fill="#86ff3c"/>
    <!-- franja / cabelo da frente -->
    <path d="M64 92c2-30 18-46 40-46 22 0 36 16 36 40-12-4-24-14-30-26-8 18-26 30-46 32z" fill="url(#hair)"/>
    <path d="M64 90c-4 20-2 44 4 62l-10-2c-8-22-6-48 6-60z" fill="url(#hair)"/>
    <path d="M136 86c6 20 4 46-4 66l10-2c8-24 6-50-6-64z" fill="url(#hair)"/>
    <!-- sobrancelhas -->
    <path d="M80 88q8-5 16 0" stroke="#1a1513" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M104 88q8-5 16 0" stroke="#1a1513" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- olhos -->
    <ellipse cx="88" cy="99" rx="5" ry="5.6" fill="#2b1d16"/>
    <ellipse cx="112" cy="99" rx="5" ry="5.6" fill="#2b1d16"/>
    <circle cx="89.6" cy="97.4" r="1.6" fill="#fff"/>
    <circle cx="113.6" cy="97.4" r="1.6" fill="#fff"/>
    <path d="M81 95q7-5 14 0M105 95q7-5 14 0" stroke="#1a1513" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- bochechas -->
    <ellipse cx="80" cy="112" rx="7" ry="4" fill="#f4a9a0" opacity=".55"/>
    <ellipse cx="120" cy="112" rx="7" ry="4" fill="#f4a9a0" opacity=".55"/>
    <!-- nariz -->
    <path d="M100 104q-3 7 1 9" stroke="#d9a58d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- sorriso -->
    <path d="M88 119q12 11 24 0q-12 5-24 0z" fill="#c9465a"/>
    <path d="M91 120q9 4 18 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
